# The settings of cava for AudioVisualizer. The shell fills in the three values written between two @ signs, each once, so they must not be named in a comment
[general]
bars = @bars@
framerate = @framerate@
autosens = 1
sensitivity = 150
[input]
method = pipewire
source = @source@
[smoothing]
noise_reduction = 25
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
